<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northwind stack · Airflow and DWH impact</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Mulish:wght@400;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f7f9fa; --ink: #2a3540; --muted: #52667a; --soft: #677279;
      --accent: #2a8013; --link: #203a9a;
      --sans: 'Mulish', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
    .name { fill: var(--ink); font: 700 12px var(--sans); text-anchor: middle; }
    .sub { fill: var(--muted); font: 400 9px var(--mono); text-anchor: middle; }
    .tag { font: 500 7px var(--mono); letter-spacing: 0.08em; text-anchor: middle; }
    .pr { fill: var(--soft); font: 500 8px var(--mono); text-anchor: end; }
    .zone { fill: var(--soft); font: 500 7px var(--mono); letter-spacing: 0.14em; text-anchor: middle; }
    .label { font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
    .legend-head { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
    .legend-text { fill: var(--muted); font: 400 9px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Northwind stack, PRs #101 to #104</p>
